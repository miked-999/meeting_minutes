name: meeting-minutes-cpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg
  - numpy>=1.24.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - sqlalchemy>=2.0.0
  - pydantic>=2.6.0
  - requests>=2.31.0
  - reportlab>=4.1.0
  - pytest
  - pip
  - conda-pack
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch>=2.2.0
      - torchaudio>=2.2.0
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.28.0
      - python-multipart>=0.0.9
      - faster-whisper>=1.0.0
      - speechbrain>=1.0.0
      - python-docx>=1.1.0
      - fpdf2>=2.7.8
      - python-jose[cryptography]>=3.3.0
      - static-ffmpeg>=2.5.0
