apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-cache-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/meeting_minutes/models_cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-cache-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
