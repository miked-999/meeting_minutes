apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-transcribe-web
  labels:
    app: meeting-transcribe
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-transcribe
      component: web
  template:
    metadata:
      labels:
        app: meeting-transcribe
        component: web
    spec:
      containers:
        - name: web
          image: meeting-transcribe-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: RETENTION_DAYS
              value: "7"
            - name: MODELS_CACHE_DIR
              value: "/app/models_cache"
            - name: DATABASE_URL
              value: "sqlite:////app/data/meeting_minutes.db"
            - name: SERVICE_ROLE
              value: "web"
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
            - name: uploads-storage
              mountPath: /app/uploads
            - name: exports-storage
              mountPath: /app/exports
            - name: logs-storage
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: data-pvc
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: exports-storage
          persistentVolumeClaim:
            claimName: exports-pvc
        - name: logs-storage
          persistentVolumeClaim:
            claimName: logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meeting-transcribe-web-service
  labels:
    app: meeting-transcribe
    component: web
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
      name: http
  selector:
    app: meeting-transcribe
    component: web
